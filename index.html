<!DOCTYPE html>

<meta charset="UTF-8">

<title>Kalpvruksha Jadibuty Bhandar</title>
<style>
:root{color-scheme:dark;--bg:#101010;--fg:#f5f5f5;--card:#222;--line:#383838;--acc:#ff8a00;--me:#292929}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:14px 18px;border-bottom:1px solid var(--line);font-size:19px;font-weight:600}
#chat{flex:1;overflow-y:auto;padding:18px;max-width:760px;width:100%;margin:0 auto;overscroll-behavior:contain}
.hello{text-align:center;margin:8vh 0 18px;font-size:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{background:#242424;border:1px solid #414141;color:var(--fg);border-radius:22px;padding:10px 15px;font-size:14px;cursor:pointer}
.chips button:active{background:#383838}
.m{margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{background:var(--me);border:1px solid #3b3b3b;padding:10px 14px;border-radius:16px;margin-left:15%}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto;background:var(--bg)}
textarea{flex:1;resize:none;min-width:0;border:1px solid #414141;background:#202020;color:var(--fg);border-radius:22px;padding:12px 16px;font:16px/1.4 system-ui;max-height:120px;min-height:48px}
textarea::placeholder{color:#999}
textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#send{flex:0 0 48px;background:var(--acc);color:#111;border:0;border-radius:50%;width:48px;height:48px;font-size:25px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.55;cursor:wait}
#mic{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid #414141;background:#242424;color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;padding:0}
#mic.listening{background:#b3261e;color:#fff;border-color:#b3261e;animation:p 1.2s infinite}
#voice-lang{max-width:78px;height:38px;align-self:center;border-radius:12px;border:1px solid #414141;background:#202020;color:var(--fg);font-size:12px;padding:0 4px}
@keyframes p{50%{box-shadow:0 0 0 5px #b3261e33}}
#error-note{color:#ffb3a7;font-size:13px;padding:0 18px 8px;max-width:760px;width:100%;margin:0 auto}
@media(max-width:420px){form{gap:6px;padding-left:8px;padding-right:8px}#mic{flex-basis:40px;width:40px;height:40px}#send{flex-basis:44px;width:44px;height:44px}#voice-lang{max-width:68px;font-size:11px}}
.gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gal figure{margin:0;width:calc(50% - 4px)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid #3b3b3b;cursor:zoom-in;display:block}
.gal figcaption{font-size:13px;color:#b7b7b7;text-align:center;margin-top:2px}
#zoom{display:none;position:fixed;inset:0;background:#000e;align-items:center;justify-content:center;z-index:9;padding:12px}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>

<header>Kalpvruksha Jadibuty Bhandar</header>
<div id="chat" aria-live="polite">

// Hi / Ok jaise chhote message ka jawab bina AI ke, turant
const norm = s => s.toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, "").replace(/\s+/g, " ").trim();
const GREET = ["hi","hii","hiii","hello","helo","hey","namaste","namaskar","jai jinendra","jay jinendra","jinendra","जय जिनेन्द्र","जय जिनेंद्र","हाय","हेलो","हैलो","नमस्ते","જય જિનેન્દ્ર","જય જિનેંદ્ર","હાય","હેલો","નમસ્તે"];
const OKS = ["ok","okay","okk","ok ok","k","thik hai","theek hai","thik he","thik","theek","ओके","ठीक है","ठीक","ઓકે","ઠીક છે","ઠીક"];
function quickReply(text) {
  const n = norm(text);
  if (GREET.includes(n)) return /[\u0A80-\u0AFF]/.test(n) ? "જય જિનેન્દ્ર 🙏" : /[\u0900-\u097F]/.test(n) ? "जय जिनेन्द्र 🙏" : "Jai Jinendra 🙏";
  if (OKS.includes(n)) return "Ok";
  return null;
}

  ["ooncha-attar", "Ooncha attar", "ooncha attar|uncha attar|unche attar", 0, "Kaunsa ooncha attar? Kasturi Arham Siddha, Brutmusk, Amber, Chandan, Agar, Khas/Valo, Kesar, Gulab, Mukh vilas, Suprabhat, Kshamamaa. Naam likhein, jaise Amber attar."]
];
const zoom = document.getElementById("zoom"), zoomImg = document.getElementById("zoomImg");
let lastPhoto = [];
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

/*FUZZY-START*/
// Spelling galti, Hindi/Gujarati/Roman: sab ko "consonant skeleton" me badalkar milate hain
const DEVMAP = {"क":"k","ख":"k","ग":"g","घ":"g","ङ":"n","च":"c","छ":"c","ज":"j","झ":"j","ञ":"n","ट":"t","ठ":"t","ड":"d","ढ":"d","ण":"n","त":"t","थ":"t","द":"d","ध":"d","न":"n","प":"p","फ":"p","ब":"b","भ":"b","म":"m","य":"y","र":"r","ल":"l","ळ":"l","व":"v","श":"s","ष":"s","स":"s","ं":"n","ँ":"n","\u0958":"k","\u0959":"k","\u095A":"g","\u095B":"j","\u095C":"d","\u095D":"d","\u095E":"p","\u095F":"y"};
const romanSkel = s => s.replace(/ch/g,"@").replace(/c/g,"k").replace(/@/g,"c")
  .replace(/sh|kh|gh|th|dh|bh|ph|jh/g, m => m[0]).replace(/w/g,"v").replace(/z/g,"j").replace(/q/g,"k")
  .replace(/x/g,"ks").replace(/f/g,"p").replace(/h/g,"").replace(/(.)\1+/g,"$1").replace(/[aeiou]/g,"");
function skel(w) {
  let out = "", buf = "";
  const flush = () => { out += romanSkel(buf); buf = ""; };
  for (let ch of w.normalize("NFC")) {
    let c = ch.charCodeAt(0);
    if (c >= 0x0A81 && c <= 0x0AFF) { c -= 0x180; ch = String.fromCharCode(c); }
    if (c >= 0x0900 && c <= 0x097F) { flush(); out += DEVMAP[ch] || ""; } else buf += ch;
  }
  flush();
  return out.replace(/(.)\1+/g, "$1");
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const KEYLIST = PHOTOS.flatMap(p => p[2].split("|").map(k => { const nk = norm(k), ws = nk.split(" "); return { p, ws, sk: ws.map(skel).join("") }; }));
function matchPhotos(n) {
  const words = n.split(" ").filter(Boolean), hits = [];
  for (const k of KEYLIST) {
    const kn = k.ws.length, L = k.sk.length;
    let ok = false, span = null;
    for (let sz = Math.max(1, kn - 1); sz <= kn + 1 && !ok; sz++)
      for (let i = 0; i + sz <= words.length && !ok; i++) {
        const win = words.slice(i, i + sz);
        if (L <= 2) { const kr = k.ws.join(""); ok = lev(win.join(""), kr) <= (kr.length >= 5 ? 1 : 0); }
        else ok = lev(win.map(skel).join(""), k.sk) <= (L <= 6 ? 0 : L <= 10 ? 1 : 2);
        if (ok) span = [i, i + sz - 1];
      }
    if (ok) hits.push({ p: k.p, s: span[0], e: span[1] });
  }
  // jis match ke shabd kisi bade match ("ooncha attar", "sugandhi aushadhi") ke andar aate hain, use hata do
  return [...new Set(hits.filter(x => !hits.some(o => o.p !== x.p && o.s <= x.s && o.e >= x.e && (o.e - o.s) > (x.e - x.s))).map(x => x.p))];
}
const PHOTO_RE = /^(ph?ot[ou]*s?|fot[ou]*s?|phto|pics?|pix|pictures?|images?|tas[bv]+(ee?|i)r)$/;
const PHOTO_SCRIPT = ["फोटो","फ़ोटो","फोटु","फोटू","फ़ोटू","तस्वीर","तसवीर","पिक्चर","इमेज","चित्र","ફોટો","ફોટા","ફોટું","તસવીર","ચિત્ર","પિક્ચર","ઇમેજ"].map(norm);
const isPhotoAsk = n => n.split(" ").some(w => PHOTO_RE.test(w)) || PHOTO_SCRIPT.some(s => n.includes(s));
/*FUZZY-END*/

async function showPhotos(list) {
  if (!list.length) { add("assistant", "Kaunsi cheez ki photo chahiye? Cheez ka naam likhein, jaise Vaskshep, Ashtagandh, Gugal."); return; }
  for (const p of list) {
    if (p[4]) { add("assistant", p[4]); continue; }
    const cnt = p[3] || 3;
    const slots = Array.from({ length: cnt }, (_, i) => [String(i + 1), "Photo"]).concat(cnt > 1 ? [["500gm", "500 gm pack"], ["1kg", "1 kg pack"]] : []);
    const got = (await Promise.all(slots.map(async ([s, cap]) => { const i = await loadImg("photos/" + p[0] + "-" + s + ".jpg"); return i ? { i, cap } : null; }))).filter(Boolean);
    if (!got.length) { add("assistant", p[1] + " ki photo abhi available nahi hai. Kalpesh Guruji se contact karein: 9879582176"); continue; }
    const box = add("assistant", p[1] + ":");
    const g = document.createElement("div");
    g.className = "gal";
    got.forEach(({ i, cap }) => {
      const f = document.createElement("figure"), c = document.createElement("figcaption");
      i.alt = cap; c.textContent = cap;
      i.addEventListener("click", () => { zoomImg.src = i.src; zoom.style.display = "flex"; });
      f.append(i, c); g.append(f);
    });
    box.append(g);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function ask(text) {
  text = (text || "").trim();
  if (busy || !text) return;
  document.getElementById("hello")?.remove();
  document.getElementById("chips")?.remove();
  errorNote.textContent = "";
  add("user", text);
  const quick = quickReply(text);
  if (quick) { add("assistant", quick); return; }
  const n = norm(text);
  let found = matchPhotos(n);
  if (found.some(p => !p[4] && (p[0].startsWith("attar-") || p[0].startsWith("ooncha-")))) found = found.filter(p => !p[4]);
  if (found.length) lastPhoto = found;
  if (isPhotoAsk(n)) { await showPhotos(found.length ? found : lastPhoto); return; }
  history.push({ role: "user", content: text });
  busy = true; send.disabled = true;
  const el = add("assistant", "जवाब तैयार हो रहा है…");
  let full = "";
  try {
    if (!API_KEY || API_KEY === "PASTE_API_KEY_HERE") {
      el.textContent = "Groq API key सेट नहीं है। index.html में API_KEY के अंदर अपनी key डालें।";
      history.pop(); return;
    }
    const model = await pickModel();
    let r;
    for (let i = 0; i < 3; i++) {
      r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        signal: AbortSignal.timeout(60000),
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
        body: JSON.stringify({
          model,
          ...(model.startsWith("openai/gpt-oss") ? { reasoning_effort: "low" } : {}),
          stream: true, max_tokens: 1200,
          messages: [{ role: "system", content: SYSTEM }].concat(history.slice(-6))
        })
      });
      if (r.status !== 429 || i === 2) break;
      const m = (await r.text()).match(/try again in ([\d.]+)(ms|s)/);
      const wait = Math.min((m ? parseFloat(m[1]) * (m[2] === "s" ? 1000 : 1) : 5000) + 500, 20000);
      el.textContent = "थोड़ा रुकिए, जवाब आ रहा है…";
      await new Promise(res => setTimeout(res, wait));
    }
    if (!r.ok) {
      el.textContent = r.status === 429
        ? "अभी बहुत सवाल आ गए हैं। कृपया 1 मिनट बाद फिर पूछें।"
        : "जवाब नहीं आ पाया। API error " + r.status + ": " + (await r.text()).slice(0, 200);
      history.pop(); return;
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split(/\r?\n/);
      buf = lines.pop() || "";
      for (const ln of lines) {
        if (!ln.startsWith("data:")) continue;
        const d = ln.slice(5).trim();
        if (d === "[DONE]") continue;
        try {
          full += JSON.parse(d).choices?.[0]?.delta?.content || "";
          if (full) { el.textContent = full; chat.scrollTop = chat.scrollHeight; }
        } catch (_) {}
      }
    }
    if (!full) { el.textContent = "जवाब नहीं आया। दोबारा कोशिश करें।"; history.pop(); }
    else history.push({ role: "assistant", content: full });
  } catch (e) {
    el.textContent = "कनेक्शन में दिक्कत हुई: " + (e?.message || "Unknown") + "। इंटरनेट/API key जाँचें।";
    history.pop();
  } finally {
    busy = false; send.disabled = false; chat.scrollTop = chat.scrollHeight;
  }
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = t.value.trim();
  if (!v || busy) return;
  t.value = ""; t.style.height = "48px";
  ask(v);
});
t.addEventListener("input", () => { t.style.height = "48px"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; });
t.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); }
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b && !busy) ask(b.textContent);
});

/* Microphone / voice typing */
const mic = document.getElementById("mic"), voiceLang = document.getElementById("voice-lang");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
function setMic(a) {
  listening = a;
  mic.classList.toggle("listening", a);
  mic.textContent = a ? "⏹" : "🎤";
  mic.setAttribute("aria-label", a ? "बोलना रोकें" : "माइक से बोलें");
}
if (!SR) {
  mic.addEventListener("click", () => {
    errorNote.textContent = "इस ऐप में voice recognition उपलब्ध नहीं है। कीबोर्ड के voice typing का इस्तेमाल करें।";
  });
} else {
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => { errorNote.textContent = "सुन रहा हूँ… अब बोलें।"; setMic(true); };
  recognition.onresult = ev => {
    let fin = "", tmp = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const tr = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) fin += tr; else tmp += tr;
    }
    const s = (fin || tmp).trim();
    if (s) { t.value = s; t.style.height = "48px"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }
  };
  recognition.onerror = ev => {
    const msg = {
      "not-allowed": "माइक की अनुमति नहीं मिली। Settings में ऐप की Microphone permission चालू करें।",
      "service-not-allowed": "Voice recognition की अनुमति नहीं है।",
      "no-speech": "आवाज़ सुनाई नहीं दी। दोबारा माइक दबाकर बोलें।",
      "network": "Voice recognition के लिए नेटवर्क में दिक्कत हुई।",
      "audio-capture": "माइक नहीं मिला। अनुमति और डिवाइस जाँचें।"
    };
    errorNote.textContent = msg[ev.error] || ("माइक में समस्या: " + ev.error);
    setMic(false);
  };
  recognition.onend = () => {
    setMic(false);
    if (t.value.trim()) errorNote.textContent = "टेक्स्ट बॉक्स में आया है। भेजने के लिए ↑ दबाएँ।";
  };
  mic.addEventListener("click", () => {
    if (listening) { recognition.stop(); return; }
    if (busy) { errorNote.textContent = "जवाब आने तक रुकें, फिर माइक इस्तेमाल करें।"; return; }
    errorNote.textContent = "";
    recognition.lang = voiceLang.value;
    try { recognition.start(); } catch (err) { errorNote.textContent = "माइक शुरू नहीं हो पाया। थोड़ी देर बाद कोशिश करें।"; }
  });
}
