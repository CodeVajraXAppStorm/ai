  try {

("https://api.groq.com/openai/v1/models", { headers: { Authorization: "Bearer " + API_KEY }, 

signal: AbortSignal.timeout(15000) });

"openai/gpt-oss-20b"];

!/whisper|tts|guard|orpheus|compound|embed|safeguard/i.test(i)) || MODEL;

pickedModel = MODEL; }

const SYSTEM = `Tum "Kalpvruksha Jadibuty

18 ABHISHEK AUSHADHI (1 kg): Kashay churn 1200,

const chat = 

document.getElementById("chat"), t = document.getElementById("t"), send = 

document.getElementById("send");
let history = [];

function add(role, text) {
  const d = 

document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "a");
  

d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async 

function ask(text) {
  document.getElementById("hello")?.remove();
  document.getElementById

("chips")?.remove();
  add("user", text);
  history.push({ role: "user", content: text });
  

send.disabled = true;
  const el = add("assistant", "...");
  let full = "";
  try {
    const model = await 

pickModel();
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      

method: "POST",
      signal: AbortSignal.timeout(60000),
      headers: { "Content-Type": 

"application/json", "Authorization": "Bearer " + API_KEY },
      body: JSON.stringify({
        model: 

model,
        ...(model.startsWith("openai/gpt-oss") ? { reasoning_effort: "low" } : {}),
        stream: 

true,
        max_tokens: 1500,
        messages: [{ role: "system", content: SYSTEM }].concat

(history.slice(-10))
      })
    });
    if (!r.ok) {
      el.textContent = "Jawab nahi aa paaya.\n\nError 

(Claude ko ye bhejein): " + (await r.text()).slice(0, 400);
    } else {
      const reader = 

r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } 

= await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        

const lines = buf.split(/\r?\n/);
        buf = lines.pop();
        for (const ln of lines) {
          if (!

ln.startsWith("data:")) continue;
          try {
            const j = JSON.parse(ln.slice(5));
            full += 

(j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || "";
            if (full) 

{ el.textContent = full; chat.scrollTop = chat.scrollHeight; }
          } catch (_) {}
        }
      }
      if (!full) 

el.textContent = "Maaf kijiye, jawab nahi aa paaya. Dobara koshish karein.";
      else 

history.push({ role: "assistant", content: full });
    }
  } catch (e) {
    if (!full) {
      el.textContent = 

"Jawab nahi aa paaya.\n\nError (Claude ko ye bhejein): " + (e && e.name) + " - " + (e && 

e.message);
      history.pop();
    } else history.push({ role: "assistant", content: full });
  }
  

send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById

("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = t.value.trim();
  if (!v || 

send.disabled) return;
  t.value = "";
  ask(v);
});
t.addEventListener("keydown", e => {
  if (e.key 

=== "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); 

document.getElementById("f").requestSubmit(); }
});
document.getElementById

("chips").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") ask

(e.target.textContent);
});
